<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100f14">
<meta name="description" content="Tu avance académico: notas, ponderados, estadísticas, logros e historia en Inicio.">
<title>ESAN — Inicio · Mi avance académico</title>
<style>

/* Tema claro por defecto; oscuro por preferencia del sistema o por el botón */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f5;--txt:#111113;--ic:#1c1c1e;
--bar:rgba(252,252,252,.92);--bar-b:rgba(0,0,0,.05);--cut:#fcfcfc;
--ind:rgba(0,0,0,.06);--ind-s:inset 0 1px 3px rgba(0,0,0,.06);
--panel:rgba(251,251,251,.94);--tile:#ebebeb;--tile-p:#dedede;
--sh:rgba(0,0,0,.09);--press:#fff;--sel:#fff;--on:#151517;--on-t:#fff;--pink:#ef8cf0;--spring:cubic-bezier(.34,1.4,.64,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0b0b0c;--txt:#f5f5f7;--ic:#f2f2f7;
--bar:rgba(30,30,32,.8);--bar-b:rgba(255,255,255,.1);--cut:#1e1e20;
--ind:rgba(255,255,255,.11);--ind-s:inset 0 1px 0 rgba(255,255,255,.08);
--panel:rgba(24,24,26,.9);--tile:rgba(255,255,255,.08);--tile-p:rgba(255,255,255,.16);
--sh:rgba(0,0,0,.6);--press:rgba(160,160,165,.92);--sel:rgba(255,255,255,.1);--on:#f5f5f7;--on-t:#111113;--pink:#ef8cf0}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0b0b0c;--txt:#f5f5f7;--ic:#f2f2f7;
--bar:rgba(30,30,32,.8);--bar-b:rgba(255,255,255,.1);--cut:#1e1e20;
--ind:rgba(255,255,255,.11);--ind-s:inset 0 1px 0 rgba(255,255,255,.08);
--panel:rgba(24,24,26,.9);--tile:rgba(255,255,255,.08);--tile-p:rgba(255,255,255,.16);
--sh:rgba(0,0,0,.6);--press:rgba(160,160,165,.92);--sel:rgba(255,255,255,.1);--on:#f5f5f7;--on-t:#111113;--pink:#ef8cf0}
:root[data-theme="light"]{color-scheme:light}
/* Respaldo si el navegador no soporta desenfoque de fondo */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
:root{--bar:#fcfcfc;--panel:#fbfbfb}
:root[data-theme="dark"]{--bar:#1e1e20;--panel:#18181a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#1e1e20;--panel:#18181a}}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:2px solid var(--ic);outline-offset:2px}
.side,.act,.menu,.trig{background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--bar-b);box-shadow:0 8px 24px var(--sh)}

/* Menú lateral fijo (escritorio) */
.side{position:fixed;z-index:3;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:280px;box-sizing:border-box;padding:12px;border-radius:30px;display:flex;flex-direction:column;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--panel);box-shadow:0 14px 40px var(--sh);transition:opacity .22s,transform .5s var(--spring),filter .35s}
.dh{display:flex;align-items:center;gap:10px;padding:2px 10px 12px;margin-bottom:6px;border-bottom:1px solid var(--bar-b);font-size:18px;font-weight:700;letter-spacing:-.02em}
.it{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border:0;border-radius:22px;background:none;text-align:left;font-size:15px;color:var(--ic);transition:background .25s,color .25s}
.it:focus-visible{outline-offset:-2px}
.it .l{flex:1}
.it.cur{background:var(--on);color:var(--on-t)}
.it.sel{background:var(--sel);box-shadow:0 2px 10px var(--sh)}
.ic{position:relative;display:grid;place-items:center}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--spring)}
.sub.ex{grid-template-rows:1fr}
.sub>div{min-height:0;overflow:hidden;visibility:hidden;margin:2px 0 2px 22px;padding-left:8px;border-left:1.5px solid color-mix(in srgb,var(--ic) 55%,transparent);transition:visibility 0s .4s}
.sub.ex>div{visibility:visible;transition-delay:0s}
.sub .it{height:40px;font-size:14.5px}

#nav{margin-bottom:22px}
.uni{margin-top:auto;display:flex;align-items:center;gap:12px;padding:16px 10px 4px;border-top:1px solid var(--bar-b)}
.um{flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:var(--tile);display:grid;place-items:center}
.uni b{display:block;font-size:14.5px;letter-spacing:-.01em}
.uni span{display:block;font-size:12px;line-height:1.3;opacity:.62}


/* Barra superior: título + perfil (+) */
.top{position:fixed;z-index:4;top:calc(12px + env(safe-area-inset-top,0px));left:304px;right:16px;height:54px;display:flex;align-items:center;gap:12px;transition:left .35s cubic-bezier(.32,.72,0,1)}
.title{flex:1;margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em}
.trig{display:none;flex:none;width:44px;height:44px;padding:0;border-radius:50%;place-items:center;color:var(--ic)}
.trig svg{transition:transform .5s var(--spring)}
.dopen .trig svg{transform:rotate(90deg)}
.pf{position:relative}
.act{display:grid;width:54px;height:54px;padding:0;border-radius:50%;place-items:center;transition:transform .35s var(--spring),background .2s}
.act:active{transform:scale(1.1);background:var(--press)}
.act svg{transition:transform .55s var(--spring)}
.menu{position:absolute;top:calc(100% + 10px);right:0;width:260px;box-sizing:border-box;padding:8px;border-radius:30px;display:grid;gap:2px;background:var(--panel);transform-origin:100% 0;opacity:0;transform:translateY(-8px) scale(.9);filter:blur(14px);pointer-events:none;transition:opacity .22s,transform .5s var(--spring),filter .35s}
.open .menu{opacity:1;transform:none;filter:blur(0);pointer-events:auto}
.scrim{position:fixed;z-index:2;inset:0;pointer-events:none}
.open .scrim,.dopen .scrim{pointer-events:auto}
.toast{position:fixed;z-index:6;top:84px;left:50%;transform:translate(-50%,-6px);padding:7px 14px;border-radius:999px;font-size:13px;background:var(--bar);border:1px solid var(--bar-b);box-shadow:0 6px 18px var(--sh);opacity:0;transition:opacity .25s,transform .4s var(--spring);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Modos del menú: full · rail (solo iconos) · hidden (desplegable, como en móvil) */
.dh span{flex:1}
.brand,.hb{border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ic)}
.hb{width:34px;height:34px;border-radius:50%;opacity:.7;transition:background .2s,opacity .2s}
.hb:hover{background:var(--ind);opacity:1}
#app[data-side=full] .brand{pointer-events:none}
#app[data-side=rail] .brand{cursor:pointer}
#app[data-side=rail] .side{width:72px;padding:12px 10px}
#app[data-side=rail] .top{left:96px}
#app[data-side=rail] .dh{justify-content:center;gap:0;padding:2px 0 12px}
#app[data-side=rail] .dh span,#app[data-side=rail] .dh .hb{display:none}
#app[data-side=rail] .side .it{justify-content:center;padding:0}
#app[data-side=rail] .side .it .l,#app[data-side=rail] .side .it>svg,#app[data-side=rail] .side .sub{display:none}
#app[data-side=rail] .uni{justify-content:center;padding:16px 0 4px}
#app[data-side=rail] .uni>div:last-child{display:none}
#app[data-side=hidden] .top{left:16px}
#app[data-side=hidden] .trig{display:grid}
#app[data-side=hidden] .side{width:min(320px,calc(100% - 24px));top:calc(76px + env(safe-area-inset-top,0px));transform-origin:0 0;opacity:0;transform:translateX(-14px) scale(.92);filter:blur(12px);pointer-events:none}
#app.dopen .side{opacity:1;transform:none;filter:blur(0);pointer-events:auto}
.mob #bRail{display:none}

/* Inicio: bloques (bento) */
.top::before{content:"";position:absolute;z-index:-1;left:0;right:-16px;top:-12px;bottom:-16px;background:linear-gradient(var(--bg) 60%,transparent);pointer-events:none}
.page{position:fixed;inset:0;z-index:0;overflow:auto;box-sizing:border-box;padding:88px 16px 28px 304px;container-type:inline-size;container-name:page;transition:opacity .2s}
#app[data-side=rail] .page{padding-left:96px}
#app[data-side=hidden] .page{padding-left:16px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;max-width:1160px}
.blk{min-width:0;box-sizing:border-box;padding:16px 18px;border-radius:26px;background:var(--panel);border:1px solid var(--bar-b);box-shadow:0 8px 24px var(--sh)}
.st{grid-column:span 3;padding:14px 18px}
.cal{grid-column:span 4}.due{grid-column:span 5}.today{grid-column:span 3;grid-row:span 2}.prog{grid-column:span 5}.goal{grid-column:span 4}
.hl{background:var(--on);color:var(--on-t)}
.sv{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sl{font-size:12.5px;opacity:.65;margin-top:4px}
.bt{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:600}
.bt small{font-weight:400;opacity:.6;font-size:12px}
.sp{flex:1}.cap1{text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center;font-size:12.5px}
.cal .cg{max-width:360px;margin:0 auto}
.cg b{font-weight:500;font-size:11px;opacity:.5;padding-bottom:4px}
.cg span{position:relative;width:30px;height:30px;margin:0 auto;display:grid;place-items:center;border-radius:50%}
.cg span.ev::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.cg .td{background:var(--on);color:var(--on-t)}
.rw{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--bar-b)}
.rw:first-of-type{border-top:0}
.rt{flex:1;min-width:0;font-size:14px}
.rt small{display:block;font-size:12px;opacity:.6}
.dn .rt{text-decoration:line-through;opacity:.5}
.ck{flex:none;width:20px;height:20px;padding:0;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--ic) 45%,transparent);background:none;display:grid;place-items:center;color:var(--on-t)}
.dn .ck{background:var(--on);border-color:var(--on)}
.chip{flex:none;padding:3px 10px;border-radius:999px;font-size:11.5px}
.p-a{background:var(--on);color:var(--on-t)}.p-m{background:var(--tile)}.p-b{border:1px solid var(--bar-b);opacity:.7}
.sub2{font-size:12.5px;opacity:.6;margin:-6px 0 6px;text-transform:capitalize}
.ses{display:flex;align-items:center;gap:12px;margin-top:8px;padding:10px 12px;border-radius:18px;background:var(--tile)}
.ses.nx{background:var(--on);color:var(--on-t)}
.tm{display:flex;flex-direction:column;min-width:44px;font-size:13px}
.tm small{font-size:11.5px;opacity:.6}
.pr{margin:12px 0}
.pl{display:flex;justify-content:space-between;font-size:13px}
.pl b{font-weight:600}
.bar2{height:8px;margin-top:6px;border-radius:4px;background:var(--tile);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:4px;background:var(--ic);opacity:.85}
.bar2.g{margin:0 0 6px}
@container page (max-width:900px){
.bento{grid-template-columns:repeat(2,minmax(0,1fr))}
.bento>*{grid-column:auto;grid-row:auto}
.bento>.w{grid-column:1/-1}}

/* Calendario / Horarios */
.cw{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;max-width:1280px;align-items:start}
.cside{order:-1;display:flex;flex-direction:column;gap:14px}
.ch{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:14px}
.nv{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.cl{margin:0 4px;font-size:17px;font-weight:600;text-transform:capitalize;letter-spacing:-.01em}
.tdb{border:1px solid var(--bar-b);background:none;padding:6px 14px;border-radius:999px;font-size:13px}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--tile)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px}
.seg .on{background:var(--sel);box-shadow:0 2px 8px var(--sh)}
.mk{display:flex;align-items:center;gap:6px;border:0;padding:8px 16px;border-radius:999px;background:var(--on);color:var(--on-t);font-size:13.5px;font-weight:500}
.wkw{overflow-x:auto}
.wk{min-width:calc(48px + var(--n)*96px)}
.wh,.wb{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr))}
.dhd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px}
.dhd small{font-size:11.5px;opacity:.6}
.dhd b{font-size:20px;font-weight:600;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.dhd.sl{background:var(--tile)}
.dhd.tdy b{background:var(--on);color:var(--on-t)}
.wb{margin-top:6px;height:780px}
.hr{position:relative}
.hr span{position:absolute;left:0;padding-top:2px;font-size:11px;opacity:.5}
.dc{position:relative;border-left:1px solid var(--bar-b);background-image:linear-gradient(var(--bar-b) 1px,transparent 1px);background-size:100% 60px}
.ev2{position:absolute;left:3px;right:3px;box-sizing:border-box;padding:6px 9px;border-radius:14px;overflow:hidden;line-height:1.25;background:var(--tile)}
.ev2 b{display:block;font-size:12.5px;font-weight:600}
.ev2 small{display:block;font-size:11px;opacity:.65}
.y-examen{background:var(--on);color:var(--on-t)}
.y-entrega{background:var(--panel);border:1.5px dashed color-mix(in srgb,var(--ic) 45%,transparent)}
.y-estudio{border-left:3px solid var(--ic)}
.nowl{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--ic)}
.nowl::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--ic)}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:560px}
.mg em{font-style:normal;font-size:11.5px;opacity:.6;text-align:center;padding:4px 0}
.mc{border:0;border-top:1px solid var(--bar-b);background:none;min-height:88px;padding:6px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.mc b{font-size:12.5px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc.tdy b{background:var(--on);color:var(--on-t)}
.mc.out{opacity:.4}
.mc small{font-size:11px;opacity:.6;margin-top:3px}
.mt{display:block;max-width:100%;box-sizing:border-box;margin-top:3px;padding:2px 7px;border-radius:8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--tile)}
.mini button{position:relative;width:30px;height:30px;margin:0 auto;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;font-size:12.5px}
.mini button u{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.mini .out{opacity:.4}
.mini .wkh{background:var(--tile)}
.mini .tdy{box-shadow:inset 0 0 0 1.5px var(--ic)}
.mini .sl{background:var(--on);color:var(--on-t)}
.rem small{font-size:12px;opacity:.7}
.rtn{font-size:17px;font-weight:600;margin:4px 0 8px}
.rme{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.85}
.fl{display:flex;align-items:center;gap:10px;width:100%;padding:7px 0;border:0;background:none;text-align:left;font-size:13.5px}
.fl.on .ck{background:var(--on);border-color:var(--on)}
.sw{width:14px;height:14px;border-radius:5px;background:var(--tile);border:1px solid var(--bar-b)}
.add{width:100%;box-sizing:border-box;margin-top:8px;padding:9px 12px;border:0;border-radius:14px;background:var(--tile);color:var(--ic);font:inherit;font-size:13.5px}
.add::placeholder{color:var(--ic);opacity:.5}
@container page (max-width:900px){.cw{grid-template-columns:minmax(0,1fr)}.cside{order:0}}

/* Grupos de estudio: cursos → salas → chat */
.s-wrap{max-width:820px}.s-wrap.w{max-width:1100px}
.s-h{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}.s-h.m{font-size:19px}
.s-sub{margin:4px 0 16px;font-size:14px;opacity:.65}
.s-srch{display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;border-radius:23px;background:var(--panel);border:1px solid var(--bar-b);box-shadow:0 4px 14px var(--sh);margin-bottom:14px}
.s-srch input{flex:1;min-width:0;border:0;background:none;color:var(--ic);font:inherit;font-size:14.5px;outline:none}
.s-srch input::placeholder,.s-cmp input::placeholder,.s-ask input::placeholder{color:var(--ic);opacity:.5}
.s-srch:focus-within{outline:2px solid var(--ic);outline-offset:2px}
.s-list{padding:6px 18px}
.s-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border:0;border-top:1px solid var(--bar-b);background:none;text-align:left}
.s-row:first-child{border-top:0}
.s-row .rt b{font-size:15px;font-weight:600}
.s-row>em{font-style:normal;font-size:12px;opacity:.55}
.s-row>svg{opacity:.7;transition:transform .3s var(--spring)}
.s-row:hover>svg{transform:translateX(3px)}
.s-fine{margin:14px 4px 0;font-size:12px;opacity:.55}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.s-card{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.s-top{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.s-top small{opacity:.55}
.s-top .chip{display:inline-flex;align-items:center;gap:5px}
.s-card h3{margin:6px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.s-card p{margin:0;font-size:13px;opacity:.65;line-height:1.35}
.s-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px}
.s-mm{display:flex;align-items:center;gap:5px;opacity:.65}
.mk.sm{padding:6px 14px;font-size:12.5px}
.s-ask{display:flex;gap:8px;margin-top:8px}
.s-ask input{flex:1;min-width:0;box-sizing:border-box;padding:8px 12px;border:0;border-radius:14px;background:var(--tile);color:var(--ic);font:inherit;font-size:13px}
.s-chat{display:flex;flex-direction:column;height:calc(100dvh - 116px);min-height:360px;padding:0;overflow:hidden}
.s-chh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bar-b)}
.s-chh .rt b{font-size:15px;font-weight:600}
.s-body{position:relative;flex:1;min-height:0;display:flex}
.s-msgs{flex:1;min-width:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.s-day{align-self:center;font-size:11.5px;opacity:.5}
.s-m{display:flex;gap:10px;max-width:78%}
.s-m.me{align-self:flex-end;flex-direction:row-reverse}
.s-av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:12px;font-weight:600}
.s-b{padding:9px 13px;border-radius:18px;background:var(--tile);font-size:14px;line-height:1.35}
.s-m.me .s-b{background:var(--on);color:var(--on-t)}
.s-mh{margin:0 4px 3px;font-size:11.5px;opacity:.55}
.s-m.me .s-mh{text-align:right}
.s-mem{width:220px;flex:none;box-sizing:border-box;border-left:1px solid var(--bar-b);padding:14px;overflow:auto}
.s-mem h4{margin:0 0 8px;font-size:12px;font-weight:500;opacity:.6}
.s-u{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.s-u .s-av{width:28px;height:28px;font-size:11px}
.s-u i{margin-left:auto;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.s-cmp{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bar-b)}
.s-cmp input{flex:1;min-width:0;height:42px;box-sizing:border-box;padding:0 16px;border:0;border-radius:21px;background:var(--tile);color:var(--ic);font:inherit;font-size:14px}

   homeClient.from('progress').select('done').eq('student_id',user.id).maybeSingle(),
   homeClient.from('grades').select('course_id, grade').eq('student_id',user.id),
   homeClient.from('course_status').select('course_id, status, times_taken, passed_at').eq('student_id',user.id),
   homeClient.from('logros').select('logro, earned_at').eq('student_id',user.id)
  ]);
  if(revision!==HOME.revision)return;
  if(results.some(r=>r.error))throw new Error('read_failed');
  const [profile,progress,grades,statuses,achievements]=results.map(r=>r.data);
  if(!profile||!CARRERAS[profile.carrera]){
   HOME.mode='profile';HOME.profile=profile;homeRender();return;
  }
  HOME.profile=profile;HOME.career=profile.carrera;HOME.done=new Set(progress?.done||[]);
  for(const row of grades||[]){const value=Number(row.grade);if(row.grade!==null&&Number.isFinite(value)&&value>=0&&value<=20)HOME.grades[row.course_id]=value}
  HOME.statuses=Object.fromEntries((statuses||[]).map(r=>[r.course_id,r]));
  HOME.achievements=Object.fromEntries((achievements||[]).map(r=>[r.logro,r.earned_at]));
  const completed=homeModel().perCycle;
  HOME.cycle=String(completed.at(-1)?.num??Object.keys(homeCareer().ciclos).map(Number).find(n=>n>0)??1);
  HOME.mode='live';homeRender();
 }catch{
  if(revision!==HOME.revision)return;
  HOME.mode='error';HOME.error='No pudimos cargar tu información académica. Reintenta para consultar tus datos.';homeRender();
 }
}
async function homeInit(){
 if(!homeClient){homeReset();homeRender();return}
 const revision=HOME.revision;
 try{
  const {data,error}=await homeClient.auth.getSession();
  if(revision!==HOME.revision)return;
  if(error)throw error;
  if(!data.session){homeReset();homeRender();return}
  const verified=await homeClient.auth.getUser();
  if(revision!==HOME.revision)return;
  if(verified.error||!verified.data.user)throw new Error('session_failed');
  await homeLoad(verified.data.user);
 }catch{
  if(revision!==HOME.revision)return;
  homeReset('error');HOME.error='No pudimos comprobar tu sesión. Reintenta o vuelve a iniciar sesión.';homeRender();
 }
}

const D=DATA,CM=Object.fromEntries(D.cursos.map(c=>[c.id,c])),sum=a=>a.reduce((x,y)=>x+y,0),pct=(a,b)=>b?Math.round(a/b*100):0;

function stt(id){

const BR={tab:0,m:null,sim:{},mo:0};let PLAN=null;

function bAuto(){const m=D.men.find(x=>x.id===BR.m),s=mst(m);BR.sim={};

function bDiag(){
  const tr=D.cursos.filter(c=>c.g==='t'),trd=tr.filter(c=>done(c.id)),trC=sum(tr.map(c=>c.cr)),trdC=sum(trd.map(c=>c.cr)),tp=pct(trdC,trC);
  const cards=D.men.map(m=>{const s=mst(m),on=BR.m===m.id;return `<button class="b-m${on?' on':''}" aria-pressed="${on}" data-a="bm" data-k="${m.id}"><b>${m.n}</b><span class="b-pc">${s.pct}%<small>de la mención</small></span>${bar(s.pct)}<div class="b-kv"><span>Requeridos</span><b>${s.nobl} obligatorios + ${m.el.min} cr electivos · ${s.reqCr} cr</b></div><div class="b-kv"><span>Completados</span><b>${s.ndone} ${s.ndone===1?'curso':'cursos'} · ${s.doneCr} cr</b></div><div class="b-kv"><span>Pendientes</span><b>${s.pend.length} obligatorios · faltan ${s.faltCr} cr</b></div><div class="b-kv"><span>Requisitos</span><b>${s.reqOk} cumplidos · ${s.reqs.length-s.reqOk} pendientes</b></div></button>`}).join('');
  const m=D.men.find(x=>x.id===BR.m);let det='<p class="b-fn">Selecciona una mención para ver el detalle de cada curso y sus requisitos.</p>';
  if(m){const s=mst(m),row=id=>{const c=CM[id],t=stt(id);return `<div class="b-crow"><div class="rt"><b>${c.n}</b><small>${t[1]}</small></div><span class="b-chip bs-${t[0]}">${SL[t[0]]}</span><span class="b-cr">${c.cr} cr</span></div>`};
    det=`<section class="blk"><h2 class="bt">Detalle de ${m.n}</h2><h3 class="b-h">Requisitos</h3>${s.reqs.map(r=>`<div class="b-req${r.ok?' ok':''}">${svg(r.ok?'tick':'minus',16)}<span>${r.t}</span><small>${r.ok?'Cumplido':'Pendiente'} · ${r.d}</small></div>`).join('')}<h3 class="b-h">Cursos obligatorios</h3>${m.obl.map(row).join('')}<h3 class="b-h">Electivos (necesitas ${m.el.min} cr de esta lista)</h3>${m.el.pool.map(row).join('')}<p class="b-fn"><b>Duración estimada:</b> ${dur(s)}. ${ASUP}</p><div class="b-act"><button class="mk" data-a="bgo" data-k="${m.id}">Planificar esta mención</button></div></section>`}
  return `<section class="blk"><h2 class="bt">${svg('cap',18)}Tronco común</h2><div class="b-pc">${tp}%<small>${trd.length}/${tr.length} cursos · ${trdC}/${trC} cr</small></div>${bar(tp)}<p class="b-fn">Mide los créditos aprobados de cursos del tronco común sobre los créditos totales del tronco. No incluye cursos de especialidad: completar el tronco no significa haber avanzado en una mención.</p></section><h2 class="bt" style="margin:4px 0 -4px">Las tres menciones</h2><p class="b-fn" style="margin:0">Cada porcentaje mide solo los créditos de la mención (obligatorios y electivos) ya aprobados sobre los que exige, sin contar el tronco.</p><div class="b-grid">${cards}</div>${det}`}
function bCmp(){
  const S=D.men.map(m=>({m,s:mst(m)})),minCr=Math.min(...S.map(x=>x.s.faltCr)),minC=Math.min(...S.map(x=>x.s.minC));
  return `<div class="b-grid">${S.map(({m,s})=>{
    const oth=D.men.filter(o=>o.id!==m.id),dis=m.obl.filter(id=>!oth.some(o=>o.obl.includes(id))),sh=m.obl.filter(id=>!dis.includes(id)),nm=id=>CM[id].n+(done(id)?' (completado)':'');
    return `<section class="blk"><h3 class="bt">${m.n}${s.faltCr===minCr?'<span class="b-chip bs-ok">Menos créditos por completar</span>':''}</h3><div class="b-kv"><span>Materias distintivas</span><b>${dis.map(nm).join(', ')||'Ninguna'}</b></div><div class="b-kv"><span>Compartidas con otras</span><b>${sh.map(nm).join(', ')||'Ninguna'}</b></div><div class="b-kv"><span>Requisitos</span><b>${s.reqOk}/${s.reqs.length} cumplidos</b></div><div class="b-kv"><span>Créditos que faltan</span><b>${s.faltCr} cr</b></div><div class="b-kv"><span>Duración estimada</span><b>${dur(s)}${s.minC===minC?' · la más corta':''}</b></div><p class="b-chg"><b>Si eliges ${m.n}:</b> ${s.nobl-s.pend.length} de sus ${s.nobl} obligatorios ya cuentan por lo que completaste. Te quedan ${s.pend.length} obligatorios (${dis.filter(id=>!done(id)).length} distintivos) y ${s.faltCr} cr por completar.</p><button class="mk" data-a="bgo" data-k="${m.id}">Planificar con esta mención</button></section>`}).join('')}</div><p class="b-fn">${ASUP}</p>`}
function bPlan(){
  const m=D.men.find(x=>x.id===BR.m);
  if(!m)return `<section class="blk"><p class="b-fn" style="margin:0 0 10px">Elige una mención para planificar tus próximos ciclos.</p><div class="b-act" style="margin:0">${D.men.map(x=>`<button class="k-btn" data-a="bm" data-k="${x.id}">${x.n}</button>`).join('')}</div></section>`;
  const s=mst(m),tr=D.cursos.filter(c=>c.g==='t'&&!done(c.id)&&!inCur(c.id)),ob=s.pend.filter(c=>!inCur(c.id)),el=m.el.pool.map(id=>CM[id]).filter(c=>!done(c.id));
  const row=c=>{const k=BR.sim[c.id],e=chk(c.id);return `<div class="b-crow"><div class="rt"><b>${c.n}</b><small>${c.cr} cr · ${stt(c.id)[1]}</small>${e?`<small class="b-bad">${e.why} Primer ciclo viable según los datos: +${e.j}. <button class="b-lk" data-a="bfix" data-k="${c.id}" data-i="${e.j}">Moverlo al ciclo +${e.j}</button></small>`:''}</div><select class="k-sel b-sel" data-bc="${c.id}" aria-label="Ciclo para ${c.n}"><option value="">Sin ubicar</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}"${k===n?' selected':''}>Ciclo +${n}</option>`).join('')}</select></div>`};
  const placed=Object.keys(BR.sim),inv=placed.filter(id=>chk(id)),left=[...tr,...ob].filter(c=>!BR.sim[c.id]).map(c=>c.n);
  const elCr=sum(m.el.pool.filter(id=>done(id)||BR.sim[id]).map(id=>CM[id].cr)),elOk=elCr>=m.el.min,mx=Math.max(0,...placed.map(id=>BR.sim[id]));
  const fin=placed.length&&!left.length&&elOk&&!inv.length?mx:null;
  const why=[inv.length?'hay cursos con prerrequisito no cumplido':'',left.length?`falta ubicar ${left.join(', ')}`:'',!elOk?`faltan ${m.el.min-elCr} cr de electivos`:'',!placed.length?'aún no ubicaste cursos':''].filter(Boolean).join('; ');
  return `<div class="b-two"><section class="blk"><h2 class="bt">${svg('cal',18)}Planificar ${m.n}</h2><p class="b-fn" style="margin:-4px 0 8px">Elige en qué ciclo llevarías cada curso. Es una simulación: no modifica tu historial académico oficial.</p><div class="b-act" style="margin:0 0 6px"><button class="k-btn" data-a="bauto">Ubicar lo antes posible</button><button class="k-btn" data-a="bclr">Limpiar</button></div>
  ${tr.length?`<h3 class="b-h">Tronco común pendiente</h3>${tr.map(row).join('')}`:''}<h3 class="b-h">Obligatorios pendientes de la mención</h3>${ob.map(row).join('')||'<p class="b-fn">No quedan obligatorios por ubicar.</p>'}<h3 class="b-h">Electivos (necesitas ${m.el.min} cr${elCr?`; llevas ${Math.min(elCr,m.el.min)}`:''})</h3>${el.map(row).join('')}</section>
  <aside class="b-side"><section class="blk"><h2 class="bt">Tu distribución</h2>${cyc(BR.sim)}<div class="b-verd">${fin?`Con esta distribución completarías la mención al final del ciclo +${fin}. <b>Es una estimación.</b>`:`Todavía no hay una fecha de término: ${why}.`}</div><p class="b-fn">Sin datos oficiales de tope de créditos, oferta por ciclo ni calendario: no se valida sobrecarga ni se muestran fechas.</p><div class="b-act"><button class="mk" data-a="bpr">Proyectar en mi plan</button></div></section></aside></div>`}
function bMine(){
  if(!PLAN)return `<section class="blk"><p class="b-fn" style="margin:0">Aún no has proyectado ninguna mención en tu plan. Planifica tus ciclos en el paso 3 y confirma.</p></section>`;
  const m=D.men.find(x=>x.id===PLAN.m);
  return `<section class="blk"><h2 class="bt">${svg('trend',18)}Mi plan · ${m.n}</h2>${cyc(PLAN.sim)}<p class="b-fn">Proyección guardada en tu plan personal. Es una estimación y no modifica tu historial oficial.</p><div class="b-act"><button class="mk" data-a="bedit">Editar en el planificador</button><button class="k-btn" data-a="brem">Quitar de mi plan</button></div></section>`}
function brujula(){
  const T=['1 · Diagnóstico','2 · Comparar','3 · Planificar','4 · Mi plan'];
  const note=D.oficial?'':`<details class="b-note"><summary><b>Datos de ejemplo.</b> Los resultados son estimaciones para ver el diseño. Ver qué datos faltan</summary><ul>${MISS.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;

  if(!(BR.mo&&cur==='Herramientas'&&kid==='Brújula IA'))return '';

const BZ={};
const bzs=k=>BZ[k]||(BZ[k]={t:-1,txt:'',ref:'',course:'',who:'',anon:!!BZC[k].anon,st:'form'});
const zReset=k=>Object.assign(bzs(k),{t:-1,txt:'',ref:'',course:'',who:'',anon:!!BZC[k].anon,st:'form'});
const zOk=k=>{const s=bzs(k);return s.t>=0&&s.txt.trim().length>=25&&BZC[k].f.every(f=>!f[5]||s[f[0]])};
const zh=s=>s.txt.trim().length<25?'Mínimo 25 caracteres':'Listo para enviar';
function zSet(el){const s=bzs(kid);s[el.dataset.zf]=el.value;const h=$('zhint');if(h){h.textContent=zh(s);$('zcnt').textContent=s.txt.length+'/800'}const b=$('zsd');if(b)b.disabled=!zOk(kid)}

/* Caja con carpetas: cae la carpeta nueva, las demás se ordenan y aparece la marca de listo */

function zRes(k,c,s){

  return `<h2 class="s-h m">${c.dn}</h2><p class="k-msg">${c.ok}</p><div class="z-chips">${ex.map(x=>`<span class="chip p-m">${esc(x)}</span>`).join('')}</div><div class="k-act" style="justify-content:center"><button class="mk" id="zagain" data-a="zagain">Enviar otra</button><button class="k-btn" data-a="zhome">Ir al inicio</button></div>`}
function zStage(k,c,s){const d=s.st==='done';return `<div class="z-wrap"><section class="blk z-stage${d?' ok':''}" id="zstage">${zSvg()}<div id="zres" aria-live="polite">${d?zRes(k,c,s):'<p class="k-msg">Archivando tu sugerencia…</p>'}</div></section></div>`}

function zSend(){const k=kid,c=BZC[k],s=bzs(k);
  if(!zOk(k)){toast(s.t<0?'Elige un tipo de recomendación':c.f.some(f=>f[5]&&!s[f[0]])?'Selecciona el curso':'Escribe al menos 25 caracteres');return}
  s.st='filing';renderPage();
  setTimeout(()=>{s.st='done';
    if(cur==='Buzón de sugerencias'&&kid===k){const st=$('zstage'),r=$('zres');
      if(st&&r){st.classList.add('ok');r.innerHTML=zRes(k,c,s);r.classList.add('z-fade');$('zagain')?.focus({preventScroll:true})}}},
    matchMedia('(prefers-reduced-motion:reduce)').matches?500:2700)}

const NAV_MOTION={ready:false,mark:null,view:null,feedback:[],ease:'cubic-bezier(.22,.7,.25,1)'};

function navMark(){const b=$('nav').querySelector('.it.cur');return b?{top:b.offsetTop,left:b.offsetLeft,width:b.offsetWidth,height:b.offsetHeight}:null;}

 const next=navMark(),prev=NAV_MOTION.mark;NAV_MOTION.mark=next;

 const motion=el.animate([
  {transform:`translateY(${prev.top-next.top}px) scaleX(${prev.width/next.width})`,opacity:.85},
  {transform:`translateY(${(prev.top-next.top)*.16}px) scaleY(1.09)`,opacity:1,offset:.52},
  {transform:'none',opacity:0}
 ],{duration:620,easing:NAV_MOTION.ease});
 motion.finished.then(()=>el.remove(),()=>el.remove());
}

function gmSoundContext(){
 if(GM_SOUND.context)return GM_SOUND.context;
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;
 try{
  const c=new Audio({latencyHint:'interactive'}),master=c.createGain();

  GM_SOUND.context=c;GM_SOUND.master=master;return c;

function gmSoundSchedule(c,destination,kind,start=c.currentTime+.008){

 const note=(frequency,offset,duration,amplitude,glide=frequency)=>{
  [1,2.005].forEach((harmonic,i)=>{
   const oscillator=c.createOscillator(),gain=c.createGain(),t=start+offset;
   oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency*harmonic,t);
   oscillator.frequency.exponentialRampToValueAtTime(glide*harmonic,t+Math.min(.09,duration*.4));
   gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(amplitude*(i?.18:1),t+.008);
   gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
   oscillator.connect(gain);gain.connect(destination);
   const voice={oscillator,gain,ended:false};voices.push(voice);
   oscillator.onended=()=>{voice.ended=true;oscillator.disconnect();gain.disconnect()};
   oscillator.start(t);oscillator.stop(t+duration+.02);
  });
 };
 if(kind==='confirm'){
  note(523.25,0,.31,.5);note(659.25,.065,.31,.4);note(783.99,.13,.32,.44);
 }else{

 const end=e=>{const d=ARC.drag;if(!d||d.id!==e.pointerId)return;el.classList.remove('dragging');$('arc').style.removeProperty('--drag');if(d.moved){ARC.suppressClick=true;if(e.type!=='pointercancel'&&Math.abs(e.clientX-d.x)>36)gmMove(e.clientX<d.x?1:-1);setTimeout(()=>ARC.suppressClick=false,50)}ARC.drag=null;};el.onpointerup=end;el.onpointercancel=end;el.onpointerleave=e=>{if(e.pointerType==='mouse')end(e)};}
function gmGameShell(g){return `<div class="gm-play-top"><div class="gm-play-label"><h2>${g.name}</h2><p class="gm-confirmed" role="status">${svg('tick',15)}Juego iniciado</p></div><button class="gm-small-button" data-gm="library">${svg('chevl',16)}Volver a juegos</button></div><div class="gm-game-body" id="gmbody"></div>`;}
function gmStart(){gmStopAuto();gmClearTimers();gmSoundPlay('confirm');const g=gameList()[ARC.active];ARC.game={id:g.id};$('arc').querySelectorAll('.gm-auto').forEach(b=>b.hidden=true);$('gmgallery').inert=true;$('gmgallery').setAttribute('aria-hidden','true');$('gmplay').innerHTML=gmGameShell(g);$('gmplay').hidden=false;
 if(g.id==='memory')gmMemory();else if(g.id==='snake')gmSnake();else if(g.id==='reaction')gmReaction();else gmQuiz(g.id);
 $('gmplay').scrollTop=0;$('gmplay').querySelector('[data-gm="library"]').focus({preventScroll:true});}
function gmLibrary(){gmClearTimers();ARC.game=null;$('gmplay').hidden=true;$('gmplay').innerHTML='';$('arc').querySelectorAll('.gm-auto').forEach(b=>b.hidden=false);$('gmgallery').inert=false;$('gmgallery').removeAttribute('aria-hidden');$('gmstart').focus({preventScroll:true});}
function gmShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a;}
function gmMemory(){const s=ARC.game;Object.assign(s,{deck:gmShuffle(['cap','clock','spark','target','compass','gamepad'].flatMap(x=>[x,x])),flipped:[],matched:[],moves:0,locked:false});$('gmbody').innerHTML=`<p class="gm-instructions">Voltea dos cartas y encuentra las seis parejas. Sin límite de tiempo.</p><div class="gm-score"><span>Parejas <b id="gmpairs">0 / 6</b></span><span>Intentos <b id="gmmoves">0</b></span></div><div class="gm-memory">${s.deck.map((x,i)=>`<button data-gm="flip" data-tile="${i}" aria-label="Carta ${i+1}, oculta"><span class="gm-hidden-symbol">${svg('spark',24)}</span></button>`).join('')}</div><p class="gm-result" id="gmresult" role="status"></p><button class="gm-play-button" data-gm="restart">Reiniciar</button>`;}
function gmFlip(i){const s=ARC.game;if(s.locked||s.flipped.includes(i)||s.matched.includes(i))return;const btns=[...$('gmplay').querySelectorAll('[data-tile]')],b=btns[i];s.flipped.push(i);b.classList.add('face');b.innerHTML=svg(s.deck[i],32);b.setAttribute('aria-label',`Carta ${i+1}, ${['cap','clock','spark','target','compass','gamepad'].indexOf(s.deck[i])+1}`);b.setAttribute('aria-pressed','true');
 if(s.flipped.length<2)return;s.moves++;$('gmmoves').textContent=s.moves;const [a,c]=s.flipped;if(s.deck[a]===s.deck[c]){s.matched.push(a,c);[a,c].forEach(k=>{btns[k].classList.add('matched');btns[k].disabled=true;btns[k].setAttribute('aria-label',`Carta ${k+1}, pareja encontrada`)});s.flipped=[];$('gmpairs').textContent=s.matched.length/2+' / 6';if(s.matched.length===12){$('gmresult').innerHTML=`¡Encontraste todas las parejas!<small>${s.moves} intentos. ¿Otra ronda?</small>`;$('gmplay').querySelector('[data-gm="restart"]').focus({preventScroll:true});}}
 else{s.locked=true;gmLater(()=>{[a,c].forEach(k=>{btns[k].classList.remove('face');btns[k].innerHTML=`<span class="gm-hidden-symbol">${svg('spark',24)}</span>`;btns[k].setAttribute('aria-label',`Carta ${k+1}, oculta`);btns[k].setAttribute('aria-pressed',false)});s.flipped=[];s.locked=false},850);}}
const GM_QUESTIONS={
 logic:[['¿Qué número continúa: 2, 4, 8, 16…?',['18','24','32','64'],2,'Cada número es el doble del anterior: 16 × 2 = 32.'],['Si todos los A son B y ningún B es C, entonces…',['Algunos A son C','Ningún A es C','Todos los C son A','No se puede concluir nada'],1,'Los A pertenecen al grupo B, y ese grupo no tiene elementos C.'],['Una libreta y un lápiz cuestan S/ 11. La libreta cuesta S/ 9 más que el lápiz. ¿Cuánto cuesta el lápiz?',['S/ 1','S/ 2','S/ 9','S/ 10'],0,'Si el lápiz cuesta x, la libreta cuesta x + 9. Entonces 2x + 9 = 11 y x = 1.'],['¿Cuál no sigue el patrón: 3, 6, 9, 13, 15?',['6','9','13','15'],2,'La secuencia aumenta de tres en tres. Debería aparecer 12 en lugar de 13.'],['Cinco máquinas hacen cinco piezas en cinco minutos. ¿Cuánto tardan 20 máquinas en hacer 20 piezas?',['5 minutos','10 minutos','20 minutos','100 minutos'],0,'Cada máquina hace una pieza en cinco minutos. Las 20 trabajan a la vez.']],
 quiz:[['Si un precio sube 10% y luego baja 10%, el precio final…',['Es igual al inicial','Es 1% menor','Es 1% mayor','Es 10% menor'],1,'Por ejemplo, S/ 100 × 1,10 × 0,90 = S/ 99. Los porcentajes se aplican sobre bases distintas.'],['¿Qué medida es menos sensible a valores extremos?',['La media','La mediana','El rango','La suma'],1,'La mediana usa la posición central de los datos y resiste mejor los valores extremos.'],['El costo de oportunidad representa…',['Solo el dinero pagado','El valor de la mejor alternativa descartada','Todas las alternativas juntas','El costo contable total'],1,'Elegir una opción implica renunciar al beneficio de la mejor alternativa disponible.'],['Una correlación entre dos variables demuestra…',['Que una causa a la otra','Que ambas son iguales','Una asociación, sin probar causalidad','Que no hay otra variable'],2,'La correlación mide asociación. Para establecer causalidad hace falta evidencia adicional.'],['En un proyecto, el alcance describe…',['Únicamente el presupuesto','El trabajo y los entregables incluidos','Solo la fecha de cierre','El organigrama de la empresa'],1,'El alcance define qué se entregará y el trabajo necesario para conseguirlo.']]
};
function gmQuiz(id){Object.assign(ARC.game,{qs:GM_QUESTIONS[id],q:0,points:0,answered:false});gmQuestion();}
function gmQuestion(){const s=ARC.game;if(s.q>=s.qs.length){$('gmbody').innerHTML=`<p class="gm-question">Reto completado.</p><p class="gm-result">${s.points} de ${s.qs.length} respuestas correctas.<small>Siempre puedes volver a practicar.</small></p><button class="gm-play-button" data-gm="restart">Jugar otra vez</button>`;return}const q=s.qs[s.q];s.answered=false;$('gmbody').innerHTML=`<div class="gm-score"><span>Pregunta <b>${s.q+1} / ${s.qs.length}</b></span><span>Aciertos <b>${s.points}</b></span></div><h3 class="gm-question">${q[0]}</h3><div class="gm-answers">${q[1].map((v,i)=>`<button class="gm-answer" data-gm="answer" data-answer="${i}">${v}</button>`).join('')}</div><p class="gm-feedback" id="gmfeedback" role="status"></p><button class="gm-play-button" id="gmnextquestion" data-gm="question" hidden>Siguiente ${svg('arrow',16)}</button>`;}
function gmAnswer(i){const s=ARC.game;if(s.answered)return;s.answered=true;const q=s.qs[s.q],ok=i===q[2];if(ok)s.points++;$('gmplay').querySelectorAll('[data-answer]').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('gmfeedback').textContent=(ok?'¡Correcto! ':'La respuesta correcta es: '+q[1][q[2]]+'. ')+q[3];$('gmnextquestion').hidden=false;$('gmnextquestion').focus({preventScroll:true});}
function gmReaction(){Object.assign(ARC.game,{phase:'idle',round:0,results:[]});$('gmbody').innerHTML=`<p class="gm-instructions">Toca para empezar, espera el verde y vuelve a tocar lo más rápido posible. Completa tres rondas.</p><div class="gm-score"><span>Ronda <b id="gmround">1 / 3</b></span><span>Mejor tiempo <b id="gmbest">—</b></span></div><button class="gm-reaction" data-gm="react" id="gmreact">${svg('target',52)}<b>¿Listo?</b><small>Toca para empezar</small></button><p class="gm-result" id="gmresult" role="status"></p>`;}
function gmReact(){const s=ARC.game,b=$('gmreact');if(s.phase==='waiting'){gmClearTimers();s.phase='idle';b.classList.remove('ready');b.innerHTML=`${svg('clock',52)}<b>Un poco antes…</b><small>Toca para volver a intentar</small>`;return}
 if(s.phase==='ready'){const ms=Math.round(performance.now()-s.start);s.results.push(ms);s.round++;s.phase='idle';b.classList.remove('ready');$('gmbest').textContent=Math.min(...s.results)+' ms';b.innerHTML=`${svg('tick',52)}<b>${ms} ms</b><small>${s.round<3?'Toca para la siguiente ronda':'Toca para jugar otra vez'}</small>`;if(s.round===3){s.phase='done';$('gmresult').innerHTML=`Promedio: ${Math.round(s.results.reduce((a,b)=>a+b,0)/3)} ms<small>Resultado de esta sesión en este dispositivo.</small>`}else $('gmround').textContent=s.round+1+' / 3';return}
 if(s.phase==='done'){gmReaction();return}s.phase='waiting';b.innerHTML=`${svg('clock',52)}<b>Espera…</b><small>Toca únicamente cuando cambie a verde</small>`;$('gmresult').textContent='';gmLater(()=>{s.phase='ready';s.start=performance.now();b.classList.add('ready');b.innerHTML=`${svg('target',52)}<b>¡Ahora!</b><small>Toca</small>`},1400+Math.random()*2000);}
function gmSnake(){Object.assign(ARC.game,{body:[[7,8],[6,8],[5,8]],dir:[1,0],queued:null,food:[11,8],points:0,phase:'idle',tick:0});$('gmbody').innerHTML=`<p class="gm-instructions">Usa las flechas, WASD o los controles táctiles. Recoge puntos y evita las paredes y tu cuerpo.</p><div class="gm-score"><span>Puntos <b id="gmsnakepoints">0</b></span><span id="gmsnakestate">Listo para comenzar</span></div><div class="gm-snake" id="gmsnake" role="img" aria-label="Tablero de Snake">${'<i></i>'.repeat(256)}</div><div class="gm-directions" aria-label="Dirección">${[[0,-1,'Arriba',-90],[-1,0,'Izquierda',180],[0,1,'Abajo',90],[1,0,'Derecha',0]].map(([x,y,t,r])=>`<button data-gm="direction" data-x="${x}" data-y="${y}" aria-label="${t}"><span style="display:flex;transform:rotate(${r}deg)">${svg('arrow',18)}</span></button>`).join('')}</div><div class="gm-snake-actions"><button class="gm-small-button" id="gmsnakego" data-gm="snakepause">Comenzar</button><button class="gm-small-button" data-gm="restart">Reiniciar</button></div><p class="gm-result" id="gmresult" role="status"></p>`;gmSnakePaint();}
function gmSnakePaint(){const s=ARC.game,cells=$('gmsnake').children;[...cells].forEach(c=>c.className='');s.body.forEach(([x,y],i)=>cells[y*16+x].className=i?'snake':'snake head');cells[s.food[1]*16+s.food[0]].className='food';$('gmsnakepoints').textContent=s.points;$('gmsnake').setAttribute('aria-label',`Tablero de Snake, ${s.points} puntos`);}
function gmSnakeStep(){const s=ARC.game;if(s.phase!=='run')return;if(s.queued){s.dir=s.queued;s.queued=null}const h=[s.body[0][0]+s.dir[0],s.body[0][1]+s.dir[1]],eat=h[0]===s.food[0]&&h[1]===s.food[1],occupied=eat?s.body:s.body.slice(0,-1);
 if(h.some(v=>v<0||v>15)||occupied.some(p=>p[0]===h[0]&&p[1]===h[1])){s.phase='done';gmClearTimers();$('gmsnakestate').textContent='Ronda terminada';$('gmresult').textContent=`Conseguiste ${s.points} puntos. ¿Lo intentas otra vez?`;$('gmsnakego').textContent='Jugar otra vez';return}s.body.unshift(h);if(eat){s.points+=10;const free=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(!s.body.some(p=>p[0]===x&&p[1]===y))free.push([x,y]);if(!free.length){s.phase='done';gmClearTimers();$('gmresult').textContent='¡Completaste todo el tablero!';$('gmsnakego').textContent='Jugar otra vez';return}s.food=free[Math.random()*free.length|0]}else s.body.pop();gmSnakePaint();}
function gmSnakePause(){const s=ARC.game;if(s.phase==='done'){gmStart();return}if(s.phase==='run'){gmClearTimers();s.phase='paused';$('gmsnakego').textContent='Reanudar';$('gmsnakestate').textContent='En pausa'}else{s.phase='run';$('gmsnakego').textContent='Pausar';$('gmsnakestate').textContent='En juego';ARC.timers.push(setInterval(()=>{if(!document.hidden)gmSnakeStep()},155));}}
function gmDirection(x,y){const s=ARC.game;if(!s||s.id!=='snake'||s.phase==='done'||s.queued)return;if(x===-s.dir[0]&&y===-s.dir[1])return;s.queued=[x,y];}
$('arc').onclick=e=>{const boot=e.target.closest('.ar-b');if(boot){if(boot.disabled)return;if(boot.id==='arx')arcClose();else arGallery();return}const b=e.target.closest('[data-gm]');if(!b||b.disabled||ARC.suppressClick)return;const a=b.dataset.gm;
 if(a==='close')arcClose();else if(a==='filter'){const previous=gameList()[ARC.active]?.id;gmStopAuto();ARC.filter=b.dataset.filter;ARC.active=0;$('arc').querySelectorAll('.gm-filter').forEach(el=>{el.classList.toggle('on',el===b);el.setAttribute('aria-pressed',el===b)});gmCards();if(previous!==gameList()[ARC.active]?.id)gmSoundPlay('move');}
 else if(a==='sound')gmSoundToggle();else if(a==='auto')gmAuto();else if(a==='prev'||a==='next'){gmStopAuto();gmMove(a==='prev'?-1:1)}else if(a==='select'){gmStopAuto();const changed=ARC.active!==+b.dataset.index;ARC.active=+b.dataset.index;gmPaint();if(changed)gmSoundPlay('move')}else if(a==='play'||a==='restart')gmStart();else if(a==='library')gmLibrary();else if(a==='flip')gmFlip(+b.dataset.tile);else if(a==='answer')gmAnswer(+b.dataset.answer);else if(a==='question'){ARC.game.q++;gmQuestion();$('gmplay').querySelector('[data-answer], [data-gm="restart"]')?.focus({preventScroll:true})}else if(a==='react')gmReact();else if(a==='direction')gmDirection(+b.dataset.x,+b.dataset.y);else if(a==='snakepause')gmSnakePause();};
document.addEventListener('keydown',e=>{if(!ARC.open)return;const s=ARC.game;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();if(s)gmLibrary();else arcClose();return}
 if(e.key==='Tab'){const all=[...$('arc').querySelectorAll('button, [tabindex="0"]')].filter(x=>!x.disabled&&!x.closest('[inert]')&&x.getClientRects().length);const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}
 if(ARC.stage!=='gallery')return;
 if(s?.id==='snake'){const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(dirs[e.key]){e.preventDefault();gmDirection(...dirs[e.key]);}else if(e.code==='Space'){e.preventDefault();gmSnakePause()}return}
 if(!s&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();gmStopAuto();gmMove(e.key==='ArrowRight'?1:-1)}
},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden||!ARC.open)return;gmSoundSuspend();if(ARC.stage==='intro'){cancelAnimationFrame(ARC.raf);arReady();return}gmStopAuto();if(ARC.game?.id==='snake'&&ARC.game.phase==='run')gmSnakePause();else if(ARC.game?.id==='reaction'&&['waiting','ready'].includes(ARC.game.phase)){gmClearTimers();gmReaction();}});
$('page').addEventListener('input',e=>{const form=e.target.closest('[data-home-grade]');if(form&&e.target.name==='grade')HOME.drafts[form.dataset.homeGrade]=e.target.value});
$('page').addEventListener('change',e=>{if(e.target.id==='h-cycle'){HOME.cycle=e.target.value;homeRender();$('h-cycle')?.focus({preventScroll:true})}});
$('page').addEventListener('submit',e=>{const form=e.target.closest('[data-home-grade]');if(form){e.preventDefault();homeSaveGrade(form)}});
$('page').addEventListener('keydown',e=>{
 const tab=e.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 e.preventDefault();const index=HOME_TABS.findIndex(t=>t[0]===HOME.tab),next=e.key==='Home'?0:e.key==='End'?HOME_TABS.length-1:(index+(e.key==='ArrowRight'?1:-1)+HOME_TABS.length)%HOME_TABS.length;
 homeTab(HOME_TABS[next][0]);
});
renderProfile();setMenu(false);applySide();go('Inicio');NAV_MOTION.ready=true;
homeInit();
window.addEventListener('focus',()=>{if(HOME.mode==='profile'&&HOME.user&&!HOME.saving.size)homeLoad(HOME.user)});
if(homeClient)homeClient.auth.onAuthStateChange((event,session)=>{
 if(event==='SIGNED_OUT'){homeReset();homeRender()}
 else if(event==='SIGNED_IN'&&session?.user&&session.user.id!==HOME.user?.id){setTimeout(()=>homeInit(),0)}
});

</script>
