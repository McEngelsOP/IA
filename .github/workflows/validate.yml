name: Validar compilación

on:
  pull_request:
  push:
    branches:
      - main
      - Oficial
      - aea
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar catálogo, reglas, SQL, Worker y compilación
        run: npm run check
