<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Globo de Geoduelo online</title><link rel="stylesheet" href="./fonts.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#e9eef2;color:#0c1a26;font:15px/1.4 'Hanken Grotesk',sans-serif}body{display:grid;grid-template-rows:minmax(0,1fr) auto}canvas{width:100%;height:100%;min-height:0;touch-action:none;cursor:grab;outline-offset:-4px}canvas:active{cursor:grabbing}canvas:focus-visible,button:focus-visible{outline:3px solid #216fb6}footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px}button{min-height:44px;min-width:44px;padding:8px 12px;border:1px solid #afbdca;border-radius:10px;background:#fbfcfd;color:#0c1a26;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}button:hover{background:#d8e4ee}span{font-size:13px;flex:1}#status{position:absolute;top:12px;left:12px;right:12px;background:#fbfcfd;padding:12px;border-radius:10px}button[hidden],#status[hidden]{display:none}::selection{background:#c24e0a;color:#fff}
</style></head><body><canvas tabindex="0" aria-label="Globo interactivo. Flechas para girar, más y menos para acercar, Enter para marcar el centro."></canvas><p id="status" role="status">Cargando globo…</p><footer><button id="out" aria-label="Alejar globo">−</button><button id="in" aria-label="Acercar globo">+</button><button id="select">Marcar centro</button><span>Arrastra para girar. Flechas y Enter con teclado.</span><button id="retry" hidden>Reintentar mapa</button></footer><script src="./vendor/d3.v3.min.js"></script><script type="module" src="./online-map.js"></script></body></html>
